# ComplexityRadar Configuration
# See ARCHITECTURE.md for full documentation

[project]
name = "My App"
description = "Example project configuration"

# Repositories to measure
[[repositories]]
url = "github.com/org/repo"
branch = "main"

# Uncomment to add more repositories
# [[repositories]]
# url = "github.com/org/another-repo"

# Dimension weights (must sum to 1.0)
[weights]
security = 0.25
delivery = 0.30
infrastructure = 0.25
code = 0.20

# Thresholds for scoring
[thresholds]
# Security
security_vulnerabilities_critical_max = 0

# Delivery
build_success_ratio_min = 0.95
stale_pull_requests_max = 5

# Infrastructure
k8s_deployments_max = 10
container_images_max = 20
