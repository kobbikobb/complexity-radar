version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gocritic
    - revive

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: package-comments
          disabled: true
        - name: blank-imports
          disabled: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
